# ATLAS configuration — Melate rules and evaluation settings live here, not in code.

paths:
  csv: data/raw/Melate.csv
  raw_db: data/processed/raw_history.sqlite3
  experiments_db: data/processed/experiments.sqlite3

analytics:
  rolling_windows: [10, 20, 50, 100]
  analytics_db: data/processed/analytics.sqlite3

optimizer:
  seed: 42
  candidate_pool_size: 500
  greedy:
    enabled: true
  covering:
    enabled: true
    pair_weight: train_frequency
  local_search:
    enabled: true
    max_passes: 20
  ensemble:
    enabled: true
    seeds: [42, 7, 99, 123, 256]
    sources: [greedy, covering]

tournament:
  champion: data/exports/local_search_candidate.json
  roster_glob: data/exports/*_candidate.json

lottery:
  name: Melate
  min_number: 1
  max_number: 56
  main_count: 6
  has_additional: true
  system_size: 8

evaluation:
  validation_ratio: 0.15
  min_absolute_delta: 1
  # Primary metric for freeze policy: draws where best ticket has >= this many main hits
  primary_metric_min_hits: 3
  freeze_policy:
    n_folds: 5
    required_fold_passes: 4
    version: walkforward-v1+bootstrap
    bootstrap:
      enabled: true
      n_resamples: 1000
      ci_level: 0.95
      seed: 42
      min_ci_lower: 0

# Placeholder Melate prize amounts for comparable ROI only (provisional: true).
prizes:
  provisional: true
  ticket_cost: 15.0
  hits_2: 20.0
  hits_2_plus_additional: 30.0
  hits_3: 40.0
  hits_3_plus_additional: 160.0
  hits_4: 1000.0
  hits_4_plus_additional: 4600.0
  hits_5: 130000.0
  hits_5_plus_additional: 150000.0
  hits_6: 30000000.0
